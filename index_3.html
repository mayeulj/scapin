        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        count += 1;

      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);

<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#17151C; --muted:#6B6775; --line:#E4E0D8;
  --brand:#8E1B32; --brand-soft:#F3E3E6;
  --a0:#D13A4F; --a1:#2D5BD0; --a2:#15946A; --a3:#7A4ED0;
  --good:#15946A; --bad:#D13A4F;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.hidden{display:none!important}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;background:var(--ink);color:#fff;border-radius:999px;padding:.85em 1.6em;font-weight:700;font-size:1.05rem;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.brand{background:var(--brand)}
.kbd{font-size:.75em;opacity:.6;font-weight:600;border:1.5px solid currentColor;border-radius:6px;padding:0 .35em;margin-left:.4em}
.tag{display:inline-block;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.local-banner{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#FFF6D6;color:#5C4A00;border:1px solid #EAD88A;font-size:.8rem;padding:.35em .9em;border-radius:999px;z-index:50}

/* ===================== ÉCRAN TABLEAU ===================== */
#host{font-size:clamp(13px,min(1.25vw,2.2vh),24px);height:100vh;height:100dvh;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:1.2em 2.2em}
.top .t{font-weight:800;font-size:1.1em}
.top .t span{color:var(--muted);font-weight:600;margin-left:.6em}
.top .right{display:flex;gap:.8em;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.4em 1em;font-weight:700}
.iconbtn{width:2.4em;height:2.4em;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.stage{flex:1;display:flex;flex-direction:column;padding:0 2.2em 2em}

/* accueil prof */
.home{flex:1;display:grid;place-items:center;text-align:center}
.home h1{font-size:3.6em;line-height:1.05;font-weight:900;letter-spacing:-.02em;margin:.3em 0 .4em}
.home p{color:var(--muted);font-size:1.2em;margin-bottom:1.6em}
.home .row{display:flex;gap:1em;justify-content:center;flex-wrap:wrap}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:2.2em}
.join-card{background:var(--card);border-radius:28px;padding:2.2em;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;border:1px solid var(--line)}
.join-card .step{color:var(--muted);font-size:1.1em;font-weight:600}
#qr{margin:1.2em 0;padding:14px;background:#fff;border-radius:16px;border:1px solid var(--line)}
#qr svg{display:block;width:min(21em,34vh);height:auto}
.code-lbl{color:var(--muted);font-weight:600;margin-top:.4em}
.code{font-size:4.2em;font-weight:900;letter-spacing:.12em;line-height:1}
.url{margin-top:.8em;font-weight:600;color:var(--muted);word-break:break-all;font-size:.95em}
.players-area{display:flex;flex-direction:column}
.players-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1em}
.players-head h2{font-size:2.2em;font-weight:900;letter-spacing:-.01em}
.players-head .count{font-size:1.4em;font-weight:800;color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:.6em;align-content:flex-start;flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.55em 1.1em;font-weight:700;font-size:1.25em;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.chip:hover{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.empty{color:var(--muted);font-size:1.2em;padding:1em 0}
.lobby-foot .btn{white-space:nowrap;flex:none}
.lobby-foot{display:flex;justify-content:space-between;align-items:center;margin-top:1.4em;gap:1em}
.hint{color:var(--muted);font-size:.95em}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* question */
.qwrap{flex:1;display:flex;flex-direction:column;gap:1.4em}
.qtext.long{font-size:2.1em}
.qtext{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:1em 1.4em;font-size:2.6em;font-weight:800;line-height:1.15;text-align:center;letter-spacing:-.01em;min-height:3.2em;display:grid;place-items:center}
.qmid{flex:1;display:flex;align-items:center;justify-content:space-between;gap:2em;min-height:7em}
.timer{position:relative;width:8.5em;height:8.5em;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-size:3.2em;font-weight:900}
.answered{text-align:center;flex:none;min-width:8em}
.answered b{display:block;font-size:3.2em;font-weight:900;line-height:1}
.answered span{color:var(--muted);font-weight:600}
.readbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;max-width:30em;margin:0 auto}
.readbar i{display:block;height:100%;background:var(--brand);width:0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.ans{display:flex;align-items:center;gap:.9em;color:#fff;border-radius:var(--r);padding:1em 1.3em;font-size:1.75em;font-weight:800;min-height:3.6em;transition:opacity .4s,transform .4s}
.ans .L{flex:none;width:1.7em;height:1.7em;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:.85em}
.ans .txt{flex:1}
.ans .cnt{font-size:.9em;opacity:.9}
.ans.dim{opacity:.25}
.ans.win{transform:scale(1.02);box-shadow:0 0 0 5px var(--ink)}
.c0{background:var(--a0)}.c1{background:var(--a1)}.c2{background:var(--a2)}.c3{background:var(--a3)}
.bars{flex:1;display:flex;gap:2.4em;align-items:flex-end;justify-content:center;height:7.5em;padding-top:.3em}
.bar{width:5.5em;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .v{font-weight:900;font-size:1.6em;margin-bottom:.2em}
.bar .b{width:100%;border-radius:12px 12px 4px 4px;min-height:8px;transition:height .7s cubic-bezier(.2,.9,.3,1)}
.bar.dim{opacity:.3}
.foot{display:flex;justify-content:flex-end;gap:1em}

/* classement */
.board{flex:1;display:flex;flex-direction:column;align-items:center}
.board h2{font-size:2.5em;font-weight:900;margin:0 0 .4em;letter-spacing:-.02em}
.rows{width:min(100%,46em);display:flex;flex-direction:column;gap:.5em}
.rowp{display:flex;align-items:center;gap:1em;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.5em 1.2em;font-size:1.45em;font-weight:800;animation:slide .5s both}
.rowp .rk{width:1.6em;color:var(--muted)}
.rowp .nm{flex:1}
.rowp .dl{color:var(--good);font-size:.7em;font-weight:700}
.rowp.first{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowp.first .rk{color:#fff;opacity:.6}
@keyframes slide{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

/* podium */
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1.4em;padding-bottom:1em;overflow:hidden}
.pod{width:13em;display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise .9s both}
.pod .nm{font-size:1.8em;font-weight:900;margin-bottom:.15em;word-break:break-word}
.pod .sc{color:var(--muted);font-weight:700;margin-bottom:.6em;font-size:1.1em}
.pod .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:center;color:#fff;font-size:4em;font-weight:900}
.pod.p1 .blk{height:36vh;background:var(--brand)}
.pod.p2 .blk{height:25vh;background:var(--a1)}
.pod.p3 .blk{height:17vh;background:var(--a2)}
.pod.p2{animation-delay:.6s}.pod.p3{animation-delay:.3s}.pod.p1{animation-delay:1.1s}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ===================== TÉLÉPHONE ===================== */
#player{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.pc{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:1em}
.pc h1{font-size:2rem;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.pc p{color:var(--muted);font-size:1.05rem}
.field{display:flex;flex-direction:column;gap:.4em;text-align:left}
.field label{font-weight:700;font-size:.9rem;color:var(--muted)}
.field input{width:100%;padding:.9em 1em;font-size:1.25rem;font-weight:700;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none;color:var(--ink)}
.field input:focus{border-color:var(--ink)}
#pCode{letter-spacing:.2em;text-align:center}
.err{color:var(--bad);font-weight:700;min-height:1.3em}
.pbig{font-size:4rem;font-weight:900;line-height:1}
.me{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.4em 1em;font-weight:800;margin:0 auto}
.phead{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted);padding:.2em 0 .8em}
.pq{font-size:1.2rem;font-weight:800;line-height:1.25;margin-bottom:.9em;text-align:left}
.pans{flex:1;display:grid;grid-template-rows:repeat(4,1fr);gap:.7em}
.pans.n2{grid-template-rows:repeat(2,1fr)}
.pans.n3{grid-template-rows:repeat(3,1fr)}
.pbtn{display:flex;align-items:center;gap:.8em;color:#fff;border-radius:18px;padding:.8em 1em;font-size:1.2rem;font-weight:800;text-align:left;min-height:3.6em;transition:transform .1s,opacity .2s}
.pbtn:active{transform:scale(.97)}
.pbtn .L{flex:none;width:1.9em;height:1.9em;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.pbtn.dim{opacity:.25}
.result{border-radius:26px;padding:2em 1em;color:#fff}
.result.ok{background:var(--good)}.result.ko{background:var(--bad)}.result.none{background:var(--muted)}
.result .big{font-size:2.4rem;font-weight:900}
.result .pts{font-size:1.4rem;font-weight:800;margin-top:.3em}
.stats{display:flex;gap:.7em}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:.9em}
.stats b{display:block;font-size:1.7rem;font-weight:900}
.stats span{color:var(--muted);font-weight:600;font-size:.9rem}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.av{width:1.9em;height:1.9em;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--line);background:#E9E1D3}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.35em 1em .35em .35em}
.chip small{font-weight:600;color:var(--muted);font-size:.7em}
.fams{display:flex;gap:1em;margin-bottom:1em;width:min(100%,46em)}
.fam{flex:1;border-radius:var(--r);padding:.7em 1.1em;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.25em}
.fam b{font-size:1.3em}
.fourb{width:min(100%,46em);display:flex;align-items:center;gap:1.1em;background:var(--ink);color:#fff;border-radius:22px;padding:1em 1.3em;margin-bottom:1em;animation:shake .6s .2s both}
.fourb .av{width:4.2em;height:4.2em;border-color:#fff}
.fourb.big{font-size:1.35em;margin-top:1.5em}
.fourb .who{margin-top:.5em;color:#cfcfd6;font-size:.95em}
.fourb h3{font-size:1.6em;font-weight:900;color:#FFD9DF}
.fourb p{font-size:1.2em;font-weight:600}
@keyframes shake{0%{transform:scale(.7);opacity:0}50%{transform:scale(1.04) rotate(-1deg);opacity:1}70%{transform:rotate(1deg)}100%{transform:none}}
.rowp .av{width:2em;height:2em}
.rowp .nm small{display:block;font-size:.5em;color:var(--muted);font-weight:600}
.rowp.first .nm small{color:#bbb}
.pod .av{width:5.5em;height:5.5em;margin-bottom:.4em;border-width:4px}
.winner{font-size:1.5em;font-weight:900;margin-top:-.5em;margin-bottom:.3em}
.rules{font-weight:700;font-size:1.05em}
.pav{width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0 auto;border:5px solid var(--line);background:#E9E1D3}
.pchar{font-weight:800;font-size:1.15rem}
.pchar span{display:block;font-size:.9rem;font-weight:700}
.pnote{background:var(--ink);color:#fff;border-radius:16px;padding:.8em;font-weight:800}
@media (max-width:900px){
  #host{font-size:13px}
  .lobby{grid-template-columns:1fr}
}

<script type="module">
/* =====================================================================
   2) BRANCHEMENT FIREBASE : colle ici la config de ton projet.
      Si databaseURL est vide, le quiz marche en "mode test" sur un seul
      ordinateur (plusieurs onglets), pratique pour essayer.
   ===================================================================== */
const FIREBASE = {
  databaseURL: "https://quiz-scapin-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quiz-scapin"
};

const QUIZ = window.QUIZ;
const P = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const ls = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} }
};
const L = ["A","B","C","D"];
const show = (ids, on) => ids.forEach(i => $(i).classList.toggle("hidden", !on));

/* ---------- couche réseau (Firebase ou local) ---------- */
async function makeNet(){
  const local = !FIREBASE.databaseURL || P.has("local");
  if(local) return localNet();
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const db = D.getDatabase(initializeApp(FIREBASE));
  return {
    local:false,
    on:(p,cb)=>D.onValue(D.ref(db,p), s=>cb(s.val())),
    set:(p,v)=>D.set(D.ref(db,p),v),
    update:(p,v)=>D.update(D.ref(db,p),v),
    remove:(p)=>D.remove(D.ref(db,p))
  };
}
function localNet(){
  const KEY="quizLocalDB", bc=new BroadcastChannel("quizLocal"), Ls=new Set();
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{} }catch{ return {} } };
  const parts=p=>p.split("/").filter(Boolean);
  const get=(t,p)=>parts(p).reduce((o,k)=>(o==null?null:(o[k]??null)),t);
  const put=(t,p,v)=>{ const ks=parts(p); let o=t;
    for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=="object"||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; }
    if(v===null||v===undefined) delete o[ks.at(-1)]; else o[ks.at(-1)]=JSON.parse(JSON.stringify(v)); };
  const notify=()=>{ const t=load(); for(const l of Ls){ const v=get(t,l.p); const j=JSON.stringify(v); if(j!==l.j){ l.j=j; l.cb(JSON.parse(j)); } } };
  bc.onmessage=notify;
  const write=fn=>{ const t=load(); fn(t); localStorage.setItem(KEY,JSON.stringify(t)); bc.postMessage(1); notify(); return Promise.resolve(); };
  return {
    local:true,
    on(p,cb){ const l={p,cb,j:undefined}; Ls.add(l); setTimeout(notify,0); return ()=>Ls.delete(l); },
    set:(p,v)=>write(t=>put(t,p,v)),
    update:(p,o)=>write(t=>{ for(const k in o) put(t,p+"/"+k,o[k]); }),
    remove:(p)=>write(t=>put(t,p,null))
  };
}
const once=(net,p)=>new Promise(res=>{ let done=false; const u=net.on(p,v=>{ if(done) return; done=true; res(v); setTimeout(()=>u&&u(),0); }); });
const rid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanName=s=>String(s||"").replace(/\s+/g," ").trim().slice(0,16);
const N=QUIZ.questions.length;
const CH=window.CHARS, FAM=window.FAM, AV=window.AV;
const avImg=(ch,cls="av")=>{ const i=document.createElement("img"); i.className=cls; i.alt=""; if(ch&&AV[ch]){ i.src=AV[ch]; i.style.borderColor=FAM[CH[ch].f].c; } return i; };
const EV_AFTER=[1,3,5,7]; // événements de Scapin après les questions 2, 4, 6 et 8
const pubQ=i=>{ const q=QUIZ.questions[i]; return { text:q.q, r:q.r, time:q.temps||20 }; };

const net = await makeNet();
if(net.local){ const b=document.createElement("div"); b.className="local-banner"; b.textContent="Mode test local (un seul ordinateur)"; document.body.appendChild(b); }

if(P.has("host")) host(); else player();

/* =====================================================================
   ÉCRAN TABLEAU (prof)
   ===================================================================== */
function host(){
  show(["host"],true);
  document.title = "Quiz : tableau";
  $("hTitle").innerHTML = esc(QUIZ.titre)+'<span id="hProg"></span>';
  $("fsBtn").onclick = toggleFS;

  let code=null, G=null, players={}, phase="home", qi=-1, timer=null, unAns=null, answers={}, lastPts={}, primary=null;
  const sections=["hHome","hLobby","hQ","hBoard","hFinal"];
  const go=id=>sections.forEach(s=>$(s).classList.toggle("hidden",s!==id));
  const prog=t=>{ const e=$("hProg"); if(e) e.textContent=t||""; };
  const setState=s=>net.set(G+"/state",{...s,ts:Date.now()});

  // --- accueil ---
  (async()=>{
    go("hHome");
    $("hHomeTitle").textContent=QUIZ.titre;
    $("hHomeSub").textContent=N+" questions. Les élèves répondent sur leur téléphone.";
    const saved=ls.get("quizHostCode");
    const st=saved?await once(net,"games/"+saved+"/state"):null;
    const btns=$("hHomeBtns"); btns.innerHTML="";
    const b1=document.createElement("button"); b1.className="btn brand"; b1.innerHTML='Créer la partie <span class="kbd">Espace</span>';
    b1.onclick=newGame; btns.appendChild(b1); primary=newGame;
    if(st && st.phase && st.phase!=="final"){
      const b2=document.createElement("button"); b2.className="btn ghost";
      b2.textContent = st.phase==="lobby" ? "Reprendre la salle d'attente ("+saved+")" : "Reprendre la partie ("+saved+", question "+(st.qi+1)+")";
      b2.onclick=()=>resume(saved,st); btns.appendChild(b2);
    }
  })();

  async function newGame(){
    code=String(QUIZ.code||Math.floor(1000+Math.random()*9000)); G="games/"+code;
    ls.set("quizHostCode",code);
    await net.set(G,{ meta:{ title:QUIZ.titre, n:N, created:Date.now() } });
    await setState({phase:"lobby",qi:-1});
    attach(); lobby();
  }
  function resume(c,st){
    code=c; G="games/"+code; attach();
    if(st.phase==="lobby") return lobby();
    qi=st.qi;
    once(net,G+"/players").then(v=>{ players=v||{}; if(st.phase==="board"||st.phase==="reveal"||st.phase==="question"||st.phase==="read") board(); });
  }
  function attach(){
    $("hCodePill").textContent="Code "+code; $("hCodePill").classList.remove("hidden");
    net.on(G+"/players",v=>{ players=v||{}; renderChips(); updateAnswered(); });
  }

  // --- salle d'attente ---
  function lobby(){
    phase="lobby"; go("hLobby"); prog("");
    const url=location.origin+location.pathname+"?g="+code+(net.local?"&local=1":"");
    $("hCode").textContent=code;
    $("hUrl").textContent=location.host+location.pathname.replace(/index\.html$/,"");
    $("qr").innerHTML=""; try{ const qr=qrcode(0,"M"); qr.addData(url); qr.make(); $("qr").innerHTML=qr.createSvgTag({cellSize:8,margin:0,scalable:true}); }catch(e){ $("qr").textContent="QR indisponible : utilise le code"; }
    $("hStart").onclick=()=>startQ(0); primary=()=>{ if(!$("hStart").disabled) startQ(0); };
    renderChips();
  }
  function renderChips(){
    const ids=Object.keys(players);
    $("hCount").textContent=ids.length;
    $("hStart").disabled=!ids.length;
    const box=$("hChips"); box.innerHTML="";
    renderFams($("hFamsL"),false);
    if(!ids.length){ box.innerHTML='<div class="empty">En attente des joueurs…</div>'; return; }
    ids.sort((a,b)=>(players[a].joined||0)-(players[b].joined||0)).forEach(id=>{
      const p=players[id], c=document.createElement("button"); c.className="chip"; c.title="Retirer";
      c.appendChild(avImg(p.ch)); const t=document.createElement("span"); t.textContent=p.name; c.appendChild(t);
      if(p.ch){ const sm=document.createElement("small"); sm.textContent=CH[p.ch].n; c.appendChild(sm); }
      c.onclick=()=>{ net.remove(G+"/players/"+id); net.remove(G+"/res/"+id); };
      box.appendChild(c);
    });
  }

  // --- question ---
  function renderAnswers(q, mode, okIdx, dist){
    const box=$("hAns"); box.innerHTML="";
    q.r.forEach((t,i)=>{
      const d=document.createElement("div");
      d.className="ans c"+i+(mode==="reveal"?(i===okIdx?" win":" dim"):"");
      d.innerHTML='<span class="L">'+L[i]+'</span><span class="txt">'+esc(t)+'</span>'+(mode==="reveal"?'<span class="cnt">'+(dist[i]||0)+'</span>':"");
      box.appendChild(d);
    });
  }
  async function startQ(i){
    qi=i; answers={}; const q=pubQ(i); if(dbl===i) q.x2=true;
    phase="read"; go("hQ"); prog("Question "+(i+1)+" / "+N+(q.x2?"  ·  points x2":""));
    $("hQText").textContent=q.text; $("hQText").classList.toggle("long",q.text.length>60);
    $("hAns").innerHTML=""; show(["hTimer","hAnswered","hBars"],false); show(["hRead"],true);
    $("hQBtn").classList.add("hidden");
    $("hReadI").style.transition="none"; $("hReadI").style.width="0";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ $("hReadI").style.transition="width 4s linear"; $("hReadI").style.width="100%"; }));
    primary=null;
    await setState({phase:"read",qi:i,n:N,q});
    if(unAns) unAns();
    unAns=net.on(G+"/answers/"+i,v=>{ answers=v||{}; updateAnswered(); });
    setTimeout(()=>{ if(phase==="read"&&qi===i) openQ(i); },4000);
  }
  function openQ(i){
    const q=pubQ(i); if(dbl===i) q.x2=true; phase="question";
    show(["hRead","hBars"],false); show(["hTimer","hAnswered"],true);
    renderAnswers(q,"open");
    $("hQBtn").classList.remove("hidden"); $("hQBtn").innerHTML='Passer <span class="kbd">Espace</span>'; $("hQBtn").onclick=endQ; primary=endQ;
    setState({phase:"question",qi:i,n:N,q});
    const end=Date.now()+q.time*1000, ring=$("hRing"), C=276.46;
    const tick=()=>{ const left=Math.max(0,end-Date.now());
      $("hNum").textContent=Math.ceil(left/1000);
      ring.style.strokeDashoffset=C*(1-left/(q.time*1000));
      ring.style.stroke = left<5000 ? "var(--bad)" : "var(--brand)";
      if(left<=0) endQ(); };
    clearInterval(timer); tick(); timer=setInterval(tick,100);
    updateAnswered();
  }
  function updateAnswered(){
    if(phase!=="question"&&phase!=="read") return;
    const n=Object.keys(answers).filter(id=>players[id]).length, tot=Object.keys(players).length;
    $("hAnsN").textContent=n+" / "+tot;
    if(phase==="question"&&tot>0&&n>=tot) setTimeout(()=>{ if(phase==="question") endQ(); },600);
  }
  async function endQ(){
    if(phase!=="question") return;
    phase="reveal"; clearInterval(timer);
    const Q=QUIZ.questions[qi], q=pubQ(qi), T=q.time*1000, okIdx=Q.ok;
    const dist=q.r.map(()=>0);
    const ids=Object.keys(players), upd={};
    lastPts={};
    ids.forEach(id=>{
      const a=answers[id]; let pts=0, ok=false;
      if(a && Number.isInteger(a.c)){ dist[a.c]=(dist[a.c]||0)+1; ok=a.c===okIdx;
        if(ok){ const ms=Math.min(T,Math.max(0,+a.ms||T)); pts=Math.round(1000*(1-ms/T/2))*(dbl===qi?2:1); } }
      lastPts[id]={pts,ok,answered:!!a};
      players[id].score=(players[id].score||0)+pts;
    });
    const ranked=ids.slice().sort((a,b)=>players[b].score-players[a].score);
    ranked.forEach((id,k)=>{
      let rank=k+1; if(k>0 && players[ranked[k-1]].score===players[id].score) rank=players[ranked[k-1]]._rank; players[id]._rank=rank;
      upd["players/"+id+"/score"]=players[id].score;
      upd["res/"+id]={qi,ok:lastPts[id].ok,pts:lastPts[id].pts,answered:lastPts[id].answered,score:players[id].score,rank,of:ids.length};
    });
    upd["state"]={phase:"reveal",qi,n:N,q,ok:okIdx,dist,ts:Date.now()};
    await net.update(G,upd);
    // affichage
    show(["hTimer","hAnswered"],false); show(["hBars"],true);
    renderAnswers(q,"reveal",okIdx,dist);
    const max=Math.max(1,...dist), bars=$("hBars"); bars.innerHTML="";
    q.r.forEach((_,i)=>{ const b=document.createElement("div"); b.className="bar"+(i===okIdx?"":" dim");
      b.innerHTML='<div class="v">'+dist[i]+'</div><div class="b c'+i+'" style="height:0"></div>'; bars.appendChild(b);
      setTimeout(()=>{ b.querySelector(".b").style.height=(8+92*dist[i]/max)+"%"; },50); });
    $("hQBtn").innerHTML='Classement <span class="kbd">Espace</span>'; $("hQBtn").onclick=board; primary=board;
  }

  function famTotals(){ const t={G:{n:0,s:0},A:{n:0,s:0}}; Object.values(players).forEach(p=>{ const f=p.f||(p.ch&&CH[p.ch].f); if(t[f]){ t[f].n++; t[f].s+=p.score||0; } });
    for(const f in t) t[f].avg=t[f].n?Math.round(t[f].s/t[f].n):0; return t; }
  function renderFams(el,scores){ const t=famTotals(); el.innerHTML="";
    ["G","A"].forEach(f=>{ const d=document.createElement("div"); d.className="fam"; d.style.background=FAM[f].c;
      d.innerHTML='<span>'+esc(FAM[f].n)+(scores?'<small style="display:block;font-size:.6em;opacity:.85">moyenne par joueur</small>':'')+'</span><b>'+(scores?t[f].avg:t[f].n)+'</b>'; el.appendChild(d); }); }
  let dbl=-1; const evOrder=["sac","amoureux","fourberie","double","spadassin","famille","vengeance"].sort(()=>Math.random()-.5); let evUsed=[];
  const byCh=list=>Object.keys(players).filter(id=>list.includes(players[id].ch));
  const names=ids=>{ const n=ids.map(id=>players[id].name); return n.length>6? n.slice(0,6).join(", ")+"…" : n.join(", "); };
  function buildEvent(k){
    const ids=Object.keys(players).sort((a,b)=>(players[b].score||0)-(players[a].score||0));
    if(k==="amoureux"){ const w=byCh(["leandre","octave","zerbinette","hyacinthe"]); if(!w.length) return null;
      return {ch:"zerbinette",t:"Scapin aide les amoureux",x:"Léandre, Octave, Zerbinette et Hyacinthe gagnent 200 points.",d:Object.fromEntries(w.map(i=>[i,200])),why:"Scapin aide les amoureux"}; }
    if(k==="sac"){ const l=byCh(["geronte"]), w=byCh(["scapin"]); if(!l.length&&!w.length) return null;
      return {ch:"geronte",t:"La scène du sac !",x:"Scapin rosse Géronte caché dans un sac : les Géronte perdent 200 points, les Scapin en gagnent 200.",d:Object.fromEntries([...l.map(i=>[i,-200]),...w.map(i=>[i,200])]),why:"la scène du sac"}; }
    if(k==="spadassin"){ const l=byCh(["argante"]), w=byCh(["sylvestre"]); if(!l.length&&!w.length) return null;
      return {ch:"sylvestre",t:"Sylvestre déguisé en spadassin",x:"Il terrorise Argante : les Sylvestre gagnent 200 points, les Argante en perdent 200.",d:Object.fromEntries([...l.map(i=>[i,-200]),...w.map(i=>[i,200])]),why:"le faux spadassin"}; }
    if(k==="vengeance"){ const w=byCh(["geronte","argante"]), l=byCh(["scapin"]); if(!l.length&&!w.length) return null;
      return {ch:"argante",t:"La vengeance des pères",x:"Géronte et Argante découvrent les fourberies : ils gagnent 250 points, les Scapin en perdent 200.",d:Object.fromEntries([...w.map(i=>[i,250]),...l.map(i=>[i,-200])]),why:"la vengeance des pères"}; }
    if(k==="fourberie"){ if(ids.length<3) return null; const top=ids.slice(0,3).filter(id=>(players[id].score||0)>0); if(!top.length) return null;
      const v=top[Math.floor(Math.random()*top.length)], g=ids[ids.length-1]; if(v===g) return null;
      return {ch:"scapin",t:"Fourberie de Scapin !",x:"Il vole 300 points à "+players[v].name+" (dans le top 3) et les donne à "+players[g].name+" (dernier).",d:{[v]:-300,[g]:300},why:"une fourberie de Scapin",noList:true}; }
    if(k==="double"){ if(qi>=N-1) return null;
      return {ch:"geronte",t:"Les 500 écus de Géronte",x:"La prochaine question rapporte double !",d:{},double:true}; }
    if(k==="famille"){ const t=famTotals(); if(!t.G.n||!t.A.n) return null; const f=t.G.avg<=t.A.avg?"G":"A";
      const w=Object.keys(players).filter(id=>players[id].f===f);
      return {ch:"scapin",t:"Scapin aide la "+FAM[f].n,x:"Elle est derrière : chaque membre gagne 150 points.",d:Object.fromEntries(w.map(i=>[i,150])),why:"Scapin aide ta famille",noList:true}; }
    return null;
  }
  async function runEvent(){
    let ev=null;
    for(const k of evOrder){ if(evUsed.includes(k)) continue; ev=buildEvent(k); if(ev){ evUsed.push(k); break; } }
    if(!ev) return null;
    const upd={}, r=await once(net,G+"/res")||{};
    ev.win=[]; ev.lose=[];
    for(const id in ev.d){ const p=players[id]; if(!p) continue; let dv=ev.d[id]; if(dv<0) dv=-Math.min(-dv,p.score||0);
      p.score=(p.score||0)+dv; (dv>=0?ev.win:ev.lose).push(id);
      upd["players/"+id+"/score"]=p.score;
      if(r[id]) upd["res/"+id]={...r[id],score:p.score,note:(dv>=0?"+":"")+dv+" points : "+ev.why+" !"}; }
    if(ev.double) dbl=qi+1;
    if(Object.keys(upd).length) await net.update(G,upd);
    return ev;
  }

  // --- classement ---
  async function board(){
    if(phase==="board") return;
    let fb=null; if(EV_AFTER.includes(qi) && qi<N-1) { phase="board"; fb=await runEvent(); }
    phase="board"; go("hBoard");
    const fbox=$("hFourb"); fbox.innerHTML="";
    if(fb){ const d=document.createElement("div"); d.className="fourb big"; d.appendChild(avImg(fb.ch));
      const tx=document.createElement("div"); tx.innerHTML='<h3></h3><p></p><p class="who"></p>';
      tx.querySelector("h3").textContent=fb.t; tx.querySelector("p").textContent=fb.x;
      if(!fb.noList){ const w=[]; if(fb.win.length) w.push("Gagnent : "+names(fb.win)); if(fb.lose.length) w.push("Perdent : "+names(fb.lose)); tx.querySelector(".who").textContent=w.join("   ·   "); }
      d.appendChild(tx); fbox.appendChild(d); }
    renderFams($("hFams"),true);
    const ids=Object.keys(players).sort((a,b)=>(players[b].score||0)-(players[a].score||0));
    const last = qi>=N-1;
    $("hBoardTitle").textContent = last ? "Classement final" : "Classement";
    const rows=$("hRows"); rows.innerHTML="";
    const rk=[]; ids.forEach((id,k)=>{ rk[k]=(k>0&&(players[ids[k-1]].score||0)===(players[id].score||0))?rk[k-1]:k+1; });
    ids.slice(0,5).forEach((id,k)=>{ const p=players[id], d=lastPts[id]?.pts;
      const r=document.createElement("div"); r.className="rowp"+(k===0?" first":""); r.style.animationDelay=(k*.08)+"s";
      r.innerHTML='<span class="rk">'+rk[k]+'</span><span class="nm"></span>'+(d?'<span class="dl">+'+d+'</span>':"")+'<span>'+(p.score||0)+'</span>';
      r.querySelector(".nm").textContent=p.name; if(p.ch){ const sm=document.createElement("small"); sm.textContent=CH[p.ch].n; r.querySelector(".nm").appendChild(sm); }
      r.insertBefore(avImg(p.ch),r.querySelector(".nm")); rows.appendChild(r); });
    rows.style.display=fb?"none":""; $("hFams").style.display=fb?"none":""; if(fb) setTimeout(()=>{ rows.style.display=""; $("hFams").style.display=""; fbox.innerHTML=""; },6000);
    if(!ids.length) rows.innerHTML='<div class="empty" style="text-align:center">Aucun joueur</div>';
    setState({phase:"board",qi,n:N,ev:fb?{t:fb.t,x:fb.x}:null});
    const next = last ? final : ()=>startQ(qi+1);
    $("hBoardBtn").innerHTML=(last?"Voir le podium":"Question suivante")+' <span class="kbd">Espace</span>';
    $("hBoardBtn").onclick=next; primary=next;
  }

  // --- podium ---
  function final(){
    phase="final"; go("hFinal"); prog("Terminé");
    const ids=Object.keys(players).sort((a,b)=>(players[b].score||0)-(players[a].score||0));
    const pod=$("hPodium"); pod.innerHTML="";
    [1,0,2].forEach(k=>{ const id=ids[k]; if(!id) return; const p=players[id];
      const d=document.createElement("div"); d.className="pod p"+(k+1);
      d.innerHTML='<div class="nm"></div><div class="sc">'+(p.score||0)+' pts</div><div class="blk">'+(k+1)+'</div>';
      d.querySelector(".nm").textContent=p.name; d.insertBefore(avImg(p.ch),d.firstChild); pod.appendChild(d); });
    const ft=famTotals(); const wf = ft.G.avg===ft.A.avg ? null : (ft.G.avg>ft.A.avg?"G":"A");
    $("hWinner").textContent = wf ? "La "+FAM[wf].n+" gagne ("+ft[wf].avg+" contre "+ft[wf==="G"?"A":"G"].avg+" de moyenne) !" : "Égalité entre les deux familles !";
    if(wf) $("hWinner").style.color=FAM[wf].c;
    setState({phase:"final",qi,n:N});
    setTimeout(confetti,1300);
    $("hAgain").onclick=()=>{ ls.del("quizHostCode"); location.reload(); }; primary=null;
  }

  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT") return;
    if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); primary&&primary(); }
    if(e.key==="f"||e.key==="F") toggleFS();
  });
}
function toggleFS(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
function confetti(){
  const c=document.createElement("div"); c.className="confetti"; const cols=["#D13A4F","#2D5BD0","#15946A","#7A4ED0","#8E1B32","#17151C"];
  for(let i=0;i<120;i++){ const p=document.createElement("i"); p.style.left=Math.random()*100+"%"; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(2.5+Math.random()*2.5)+"s"; p.style.animationDelay=(Math.random()*1.5)+"s"; p.style.transform="rotate("+Math.random()*360+"deg)"; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),7000);
}

/* =====================================================================
   TÉLÉPHONE (élève)
   ===================================================================== */
function player(){
  show(["player"],true);
  $("pTag").textContent=QUIZ.titre;
  const secs=["pJoin","pWait","pQ","pRes"];
  const go=id=>secs.forEach(s=>$(s).classList.toggle("hidden",s!==id));
  // en mode test local, chaque onglet = un joueur différent
  const idStore = net.local ? { get:k=>sessionStorage.getItem(k), set:(k,v)=>sessionStorage.setItem(k,v), del:k=>sessionStorage.removeItem(k) } : ls;
  let myCh=null; let code=(P.get("g")||"").replace(/\D/g,"").slice(0,4), G=null, pid=null, me=null, st=null, res=null, myAns={}, shownQi=-1, shownAt=0, tInt=null, subs=[];

  if(code){ $("pCode").value=code; $("pCodeField").classList.add("hidden"); }
  $("pName").value=ls.get("quizName")||"";
  $("pJoinBtn").onclick=join;
  [$("pCode"),$("pName")].forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter") join(); }));
  go("pJoin");

  // reconnexion automatique
  (async()=>{
    if(!code) return;
    const saved=idStore.get("quizPid_"+code); if(!saved) return;
    const p=await once(net,"games/"+code+"/players/"+saved);
    if(p){ pid=saved; G="games/"+code; enter(p.name); }
  })();

  async function join(){
    const c=$("pCode").value.replace(/\D/g,""), name=cleanName($("pName").value);
    $("pErr").textContent="";
    if(c.length!==4){ $("pCodeField").classList.remove("hidden"); return $("pErr").textContent="Le code fait 4 chiffres."; }
    if(!name) return $("pErr").textContent="Écris ton prénom.";
    $("pJoinBtn").disabled=true;
    let s=await once(net,"games/"+c+"/state");
    if((!s || s.phase==="final") && c===String(QUIZ.code)){
      // la partie n'est pas encore ouverte : on attend sur cette page
      $("pMe1").textContent=name; wait("Le quiz n'a pas encore commencé","Garde cette page ouverte, tu rejoindras automatiquement.");
      s=await new Promise(res=>{ const u=net.on("games/"+c+"/state",v=>{ if(v&&v.phase==="lobby"){ setTimeout(()=>u&&u(),0); res(v); } }); });
    }
    if(!s){ $("pJoinBtn").disabled=false; go("pJoin"); $("pCodeField").classList.remove("hidden"); return $("pErr").textContent="Partie introuvable, vérifie le code."; }
    if(s.phase==="final"){ $("pJoinBtn").disabled=false; return $("pErr").textContent="Cette partie est terminée."; }
    code=c; G="games/"+code;
    pid=idStore.get("quizPid_"+code)||rid();
    const ex=await once(net,G+"/players/"+pid);
    let ch=ex?.ch;
    if(!ch){ const all=Object.values(await once(net,G+"/players")||{});
      const cnt={G:0,A:0}; all.forEach(p=>{ if(cnt[p.f]!==undefined) cnt[p.f]++; });
      const f = cnt.G===cnt.A ? (Math.random()<.5?"G":"A") : (cnt.G<cnt.A?"G":"A");
      const used=all.map(p=>p.ch); let pool=Object.keys(CH).filter(k=>CH[k].f===f);
      const free=pool.filter(k=>!used.includes(k)); if(free.length) pool=free;
      ch=pool[Math.floor(Math.random()*pool.length)]; }
    await net.set(G+"/players/"+pid,{ name, score: ex?.score||0, joined: ex?.joined||Date.now(), ch, f:CH[ch].f });
    idStore.set("quizPid_"+code,pid); ls.set("quizName",name);
    $("pJoinBtn").disabled=false;
    enter(name);
  }

  function enter(name){
    me=name; $("pMe1").textContent=name;
    subs.forEach(u=>u&&u()); subs=[];
    let seen=false;
    subs.push(net.on(G+"/players/"+pid,v=>{
      if(v){ seen=true; if(v.ch&&v.ch!==myCh){ myCh=v.ch; const a=$("pAv"); a.src=AV[myCh]; a.style.borderColor=FAM[CH[myCh].f].c; a.classList.remove("hidden");
        const c=$("pChar"); c.innerHTML=""; c.textContent="Tu es "+CH[myCh].n; const sp=document.createElement("span"); sp.textContent=FAM[CH[myCh].f].n; sp.style.color=FAM[CH[myCh].f].c; c.appendChild(sp); c.classList.remove("hidden"); } return; }
      if(seen){ subs.forEach(u=>u&&u()); subs=[]; idStore.del("quizPid_"+code); go("pJoin"); $("pErr").textContent="Tu as été retiré de la partie."; }
    }));
    subs.push(net.on(G+"/state",v=>{ st=v; render(); }));
    subs.push(net.on(G+"/res/"+pid,v=>{ res=v; render(); }));
  }

  function wait(title,sub,spin=true){ go("pWait"); $("pWaitTitle").textContent=title; $("pWaitSub").textContent=sub||""; $("pSpin").classList.toggle("hidden",!spin); }

  function render(){
    clearInterval(tInt);
    if(!st) return wait("Connexion…","");
    const n=st.n||N;
    if(st.phase==="lobby") return wait("Tu es dans la partie !","Regarde le tableau, ça va commencer.");
    if(st.phase==="read") return wait("Question "+(st.qi+1)+" / "+n,(st.q&&st.q.x2)?"Attention : points x2 !":"Lis bien la question au tableau…");
    if(st.phase==="question"){
      if(shownQi!==st.qi){ shownQi=st.qi; shownAt=Date.now(); }
      if(myAns[st.qi]!==undefined) return wait("Réponse envoyée","Attends les autres…");
      return question();
    }
    if(st.phase==="reveal"){
      if(!res||res.qi!==st.qi) return wait("Résultats…","");
      return result();
    }
    if(st.phase==="board"){
      if(res&&res.qi===st.qi) return result(true);
      return wait("Classement au tableau","");
    }
    if(st.phase==="final"){
      go("pRes");
      const r=res||{score:0,rank:"-",of:"-"};
      const box=$("pResBox"); box.className="result ok"; box.style.background="var(--ink)";
      $("pResBig").textContent = r.rank===1?"Tu as gagné !": r.rank<=3?"Sur le podium !":"Bien joué !";
      $("pResPts").textContent = r.rank+(r.rank===1?"re":"e")+" sur "+r.of;
      $("pScore").textContent=r.score; $("pRank").textContent=r.rank+(r.rank===1?"er":"e");
      $("pNote").classList.add("hidden");
      $("pResMsg").textContent="Merci d'avoir joué, "+me+(myCh?" ("+CH[myCh].n+")":"")+" !";
      return;
    }
  }

  function question(){
    go("pQ"); const q=st.q; const qi=st.qi;
    $("pQNum").textContent="Question "+(qi+1)+" / "+(st.n||N)+(q.x2?" · points x2 !":"");
    $("pQText").textContent=q.text;
    const box=$("pAns"); box.innerHTML=""; box.className="pans n"+q.r.length;
    q.r.forEach((t,i)=>{
      const b=document.createElement("button"); b.className="pbtn c"+i;
      b.innerHTML='<span class="L">'+L[i]+'</span><span></span>'; b.lastChild.textContent=t;
      b.onclick=()=>{
        if(myAns[qi]!==undefined) return;
        myAns[qi]=i; const ms=Date.now()-shownAt;
        box.querySelectorAll(".pbtn").forEach((x,k)=>x.classList.toggle("dim",k!==i));
        net.set(G+"/answers/"+qi+"/"+pid,{c:i,ms});
        if(navigator.vibrate) navigator.vibrate(30);
        setTimeout(()=>{ if(st&&st.phase==="question"&&st.qi===qi) wait("Réponse envoyée","Attends les autres…"); },350);
      };
      box.appendChild(b);
    });
    const end=shownAt+q.time*1000;
    const tick=()=>{ const s=Math.max(0,Math.ceil((end-Date.now())/1000)); $("pTime").textContent=s+" s"; };
    tick(); tInt=setInterval(tick,250);
  }

  function result(onBoard){
    go("pRes"); const r=res, box=$("pResBox"); box.style.background="";
    if(!r.answered){ box.className="result none"; $("pResBig").textContent="Trop tard !"; $("pResPts").textContent="+0"; }
    else if(r.ok){ box.className="result ok"; $("pResBig").textContent="Bonne réponse"; $("pResPts").textContent="+"+r.pts; }
    else { box.className="result ko"; $("pResBig").textContent="Raté"; $("pResPts").textContent="+0"; }
    $("pScore").textContent=r.score; $("pRank").textContent=r.rank+(r.rank===1?"er":"e");
    const nt = onBoard ? (r.note || (st.ev ? st.ev.t+" "+st.ev.x : "")) : "";
    $("pNote").classList.toggle("hidden",!nt); $("pNote").textContent=nt;
    $("pResMsg").textContent = onBoard ? "Regarde le classement au tableau." : (r.rank===1?"Tu es en tête !":"Tu es "+r.rank+"e sur "+r.of+".");
  }
}
</script>
